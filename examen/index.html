TU CASO: LAVANDERÍA BURBUJAS

Burbujas es una lavandería de barrio que quiere su primera página. Construyan esto:

TITLE Y H1
- title: Lavandería Burbujas
- h1 (dentro del header): Lavandería Burbujas

NAV (3 enlaces internos, dentro del header)
- Inicio, que apunta a #inicio (el id va en el header)
- Nuestros lavados, que apunta a #lavados
- Contacto, que apunta a #contacto

SECTION 1 — id="lavados"
- h2: Nuestros lavados
- Un párrafo corto de una o dos líneas presentando la lavandería (lo escriben ustedes).
- Una lista ul con exactamente estos 3 items:
  Lavado por kilo - Bs 15
  Planchado de camisa - Bs 8
  Lavado de edredón - Bs 35

SECTION 2 — id="contacto"
- h2: Deja tu encargo
- Un formulario con estos 3 campos, cada uno con su label conectado con for:
  1. Nombre completo — input type="text" id="nombre" required
  2. Correo electrónico — input type="email" id="correo" required
  3. Tu encargo — textarea id="encargo"
- Después de cerrar el formulario (fuera del form) van el botón y el párrafo vacío:
  - un botón: button type="button" id="btn-confirmar" con el texto Confirmar encargo
    (va con type="button" a propósito, así la página no se recarga)
  - un párrafo vacío: p id="mensaje" class="oculto"

FOOTER
Parcial 1 - [su nombre completo] - 3 de agosto de 2026
Ojo: esa fecha va tal cual. Es la del parcial, no la de tu turno — no la cambies.

LO QUE DEBE HACER EL BOTÓN (JavaScript, en script.js)
Al hacer click en el botón Confirmar encargo, el párrafo vacío debe mostrar este texto:

Encargo recibido - te atiende [su nombre completo]

Para lograrlo necesitan, todo dentro de una función: seleccionar el párrafo con document.querySelector, ponerle el texto con textContent, y quitarle la clase oculto con classList.remove para que se vea. La función se conecta al botón con addEventListener("click", ...). Su nombre completo va escrito dentro del texto, en su código: es su firma.
